[package]
name = "sshto"
version = "0.2.0"
edition = "2021"

[dependencies]
crossterm = "0.29"
unicode-width = "0.2"

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(windows)'.dev-dependencies]
portable-pty = "0.9"
vt100 = "0.16"
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_UI_Input_KeyboardAndMouse"] }
